[package]
name = "flowlight-daemon"
description = "Loads Flowlight's eBPF programs, resolves what the kernel reports into process identities, and prints them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "flowlightd"
path = "src/main.rs"

[dependencies]
flowlight-agents.workspace = true
flowlight-ask.workspace = true
flowlight-common = { workspace = true, features = ["user"] }
flowlight-rules.workspace = true
flowlight-store.workspace = true
anyhow.workspace = true
aya.workspace = true
clap.workspace = true
libc = "0.2"
loona-hpack.workspace = true
tiny_http = "0.12"
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

[build-dependencies]
anyhow.workspace = true
aya-build.workspace = true

[lints]
workspace = true
