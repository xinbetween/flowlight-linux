[package]
name = "flowlight-gui"
description = "The native interface: a GTK4 window that runs as you, talking to a daemon that runs as root."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.92"
publish = false

[[bin]]
name = "flowlight"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel = "2"
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
