# Checks every push, on Linux, because that is the only place this software runs.
#
# Most of it is being written on a Mac, where the eBPF half cannot be compiled and a probe cannot be loaded.
# That makes CI the verifier rather than a second opinion: if a change is not checked here, it is not checked.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody has to act on is a warning everybody learns to scroll past.
  RUSTFLAGS: -D warnings
  # Pinned, with its hash. The linker turns our code into the bytecode the kernel's verifier judges, so a new
  # one arriving unannounced would change what the verifier sees without anything in this repository changing.
  BPF_LINKER_VERSION: "0.11.1"
  BPF_LINKER_SHA256: "e058a6aecc9e65fa4c977b298a8e4b738424d7629769fd352eed409fb57e16e8"

jobs:
  check:
    # Pinned rather than `ubuntu-latest`: that label moves without asking, and a kernel or toolchain change
    # arriving on somebody else's schedule is exactly what this project cannot absorb quietly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install the toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          # The BPF target has no prebuilt `core`, so it is compiled from source, which is nightly-only.
          rustup toolchain install nightly --profile minimal --component rust-src
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      # The prebuilt binary rather than `cargo install`: building it from source means building against a
      # matching LLVM, which means installing one, which is ten minutes of CI for a tool that does not change.
      - name: Install bpf-linker
        run: |
          set -euo pipefail
          url="https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl -fsSL -o /tmp/bpf-linker.tar.zst "$url"
          echo "${BPF_LINKER_SHA256}  /tmp/bpf-linker.tar.zst" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xpf /tmp/bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bpf-linker" --version

      - name: Formatting
        run: cargo fmt --all --check

      # `flowlight-ebpf` is excluded from the host-target commands and checked by being compiled for the BPF
      # target as part of the daemon's build script. Linting it here would mean linting it for x86_64, which
      # is not a target it has a meaning on.
      - name: Clippy
        run: cargo clippy --workspace --exclude flowlight-ebpf --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --exclude flowlight-ebpf --all-features

      # The kernel this runs on, recorded in the log. When a probe later fails to attach, the first question is
      # always which kernel it was, and a run from six months ago cannot be asked afterwards.
      - name: Kernel and BPF availability
        run: |
          uname -srm
          echo "unprivileged_bpf_disabled: $(cat /proc/sys/kernel/unprivileged_bpf_disabled 2>/dev/null || echo 'unreadable')"
          test -d /sys/fs/bpf && echo "bpffs: mounted" || echo "bpffs: absent"
          echo "--- sock/inet_sock_set_state layout on this kernel:"
          sudo cat /sys/kernel/tracing/events/sock/inet_sock_set_state/format 2>/dev/null \
            || sudo cat /sys/kernel/debug/tracing/events/sock/inet_sock_set_state/format

      - name: Build the daemon
        run: cargo build --release --package flowlight-daemon

      # The part that cannot be faked. Loads the programs into a real kernel, attaches them, makes real
      # requests, and insists on finding them: the connection with the right process and port, and the
      # request itself in the clear.
      - name: Attribute and read a real request
        env:
          # `gh` is written in Go, so its TLS is linked into its own binary and Flowlight cannot read it.
          # That is the case Coverage exists to name, and the smoke test asserts it does.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A client that uses GnuTLS by definition, so the GnuTLS probes are exercised rather than assumed.
          # The runner's own curl and wget are both OpenSSL, which would test the same path three times.
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnutls-bin
          ./scripts/smoke.sh target/release/flowlightd
