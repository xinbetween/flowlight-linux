# Checks every push, on Linux, because that is the only place this software runs.
#
# Most of it is being written on a Mac, where the eBPF half cannot be compiled and a probe cannot be loaded.
# That makes CI the verifier rather than a second opinion: if a change is not checked here, it is not checked.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody has to act on is a warning everybody learns to scroll past.
  RUSTFLAGS: -D warnings
  # Pinned, with its hash. The linker turns our code into the bytecode the kernel's verifier judges, so a new
  # one arriving unannounced would change what the verifier sees without anything in this repository changing.
  BPF_LINKER_VERSION: "0.11.1"
  BPF_LINKER_SHA256: "e058a6aecc9e65fa4c977b298a8e4b738424d7629769fd352eed409fb57e16e8"

jobs:
  check:
    # Pinned rather than `ubuntu-latest`: that label moves without asking, and a kernel or toolchain change
    # arriving on somebody else's schedule is exactly what this project cannot absorb quietly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The native interface is GTK4. Installed before anything is compiled, because the bindings need the
      # headers at build time and the failure without them is a wall of pkg-config.
      - name: Install the interface's libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev

      - name: Install the toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          # The BPF target has no prebuilt `core`, so it is compiled from source, which is nightly-only.
          rustup toolchain install nightly --profile minimal --component rust-src
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      # The prebuilt binary rather than `cargo install`: building it from source means building against a
      # matching LLVM, which means installing one, which is ten minutes of CI for a tool that does not change.
      - name: Install bpf-linker
        run: |
          set -euo pipefail
          url="https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl -fsSL -o /tmp/bpf-linker.tar.zst "$url"
          echo "${BPF_LINKER_SHA256}  /tmp/bpf-linker.tar.zst" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xpf /tmp/bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bpf-linker" --version

      - name: Formatting
        run: cargo fmt --all --check

      # `flowlight-ebpf` is excluded from the host-target commands and checked by being compiled for the BPF
      # target as part of the daemon's build script. Linting it here would mean linting it for x86_64, which
      # is not a target it has a meaning on.
      - name: Clippy
        run: cargo clippy --workspace --exclude flowlight-ebpf --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --exclude flowlight-ebpf --all-features

      # The kernel this runs on, recorded in the log. When a probe later fails to attach, the first question is
      # always which kernel it was, and a run from six months ago cannot be asked afterwards.
      - name: Kernel and BPF availability
        run: |
          uname -srm
          echo "unprivileged_bpf_disabled: $(cat /proc/sys/kernel/unprivileged_bpf_disabled 2>/dev/null || echo 'unreadable')"
          test -d /sys/fs/bpf && echo "bpffs: mounted" || echo "bpffs: absent"
          echo "--- sock/inet_sock_set_state layout on this kernel:"
          sudo cat /sys/kernel/tracing/events/sock/inet_sock_set_state/format 2>/dev/null \
            || sudo cat /sys/kernel/debug/tracing/events/sock/inet_sock_set_state/format

      - name: Build the daemon and the interface
        run: cargo build --release --package flowlight-daemon --package flowlight-gui

      # And the daemon again, statically linked, which is the one that ships. A binary linked against this
      # runner's glibc is a binary that does not start on Debian 12 or RHEL 9, and the package it went into
      # said `Depends: libc6` with no version — so it installed there and then failed.
      - name: Build the daemon with no libc requirement
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl --package flowlight-daemon
          static=target/x86_64-unknown-linux-musl/release/flowlightd
          file "$static"
          # The assertion, rather than the description: `ldd` naming a shared object means something would
          # have to be installed for this to run, which is the whole thing being avoided.
          if ldd "$static" 2>&1 | grep -q '=>'; then
            echo "the daemon is dynamically linked after all:"; ldd "$static"; exit 1
          fi
          "$static" --version

      # The part that cannot be faked. Loads the programs into a real kernel, attaches them, makes real
      # requests, and insists on finding them: the connection with the right process and port, and the
      # request itself in the clear.
      # Built and then installed on the machine that built it, which is the only way to find out whether a
      # package works: a `.deb` that unpacks is not a `.deb` that installs.
      - name: Build the packages and install them
        run: |
          set -euo pipefail
          # The static daemon and the dynamic interface in one directory, because that is what a package
          # carries: the window needs GTK at runtime and the daemon needs nothing at all.
          mkdir -p target/packaged
          install -m 755 target/x86_64-unknown-linux-musl/release/flowlightd target/packaged/flowlightd
          install -m 755 target/release/flowlight target/packaged/flowlight
          ./packaging/deb/build.sh 0.0.0-ci amd64 target/packaged
          ls -l target/deb
          # `Depends` on the daemon at all would mean something has to be installed for it to run.
          if ar p target/deb/flowlight_0.0.0-ci_amd64.deb control.tar.gz | tar -xzO ./control \
              | grep -q '^Depends:'; then
            echo "the daemon package declares a dependency it does not have"; exit 1
          fi
          sudo apt-get install -y -qq ./target/deb/flowlight_0.0.0-ci_amd64.deb
          # Installed and not running, which is the whole point of shipping the unit disabled.
          test -x /usr/sbin/flowlightd
          systemctl is-enabled flowlightd && { echo "the unit is enabled; it must not be"; exit 1; } || true
          systemctl is-active flowlightd && { echo "the daemon is running; it must not be"; exit 1; } || true
          /usr/sbin/flowlightd --version
          # And it comes off again without leaving the history behind, unless asked.
          sudo apt-get remove -y -qq flowlight
          test ! -x /usr/sbin/flowlightd
          echo "the package installs, does not start itself, and comes off again"

      # The archive that apt reads, built from the packages just built. Signing needs a key that exists in one
      # place and installing from it is the `apt` workflow's job; what is checked here is the part that needs
      # nothing — that the index names every package with the hash it actually has.
      - name: Build the apt archive
        run: |
          set -euo pipefail
          ./packaging/apt/build.sh target/deb /tmp/archive 0.0.0-ci
          test -f /tmp/archive/dists/stable/Release
          test -f /tmp/archive/index.html
          grep -q '^Package: flowlight$' /tmp/archive/dists/stable/main/binary-amd64/Packages
          # Every Filename resolves and every SHA256 is the file's own, checked rather than assumed: an index
          # that names a hash nothing has is an archive that fails on somebody else's machine.
          ( cd /tmp/archive && awk '/^Filename: /{f=$2} /^SHA256: /{print $2"  "f}' \
              dists/stable/main/binary-amd64/Packages | sha256sum --check --strict )
          ( cd /tmp/archive/dists/stable && awk '/^SHA256:/{on=1;next} /^[A-Za-z]/{on=0} on{print $1"  "$3}' \
              Release | sha256sum --check --strict )
          echo "the archive's index and Release agree with what is in the pool"

      # Handed to the job that runs it inside other distributions, rather than built there: four containers
      # each compiling the workspace would be forty minutes of CI to prove something about one binary.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-daemon
          path: target/x86_64-unknown-linux-musl/release/flowlightd
          if-no-files-found: error

      - name: Attribute and read a real request
        env:
          # `gh` is written in Go, so its TLS is linked into its own binary and Flowlight cannot read it.
          # That is the case Coverage exists to name, and the smoke test asserts it does.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A client that uses GnuTLS by definition, so the GnuTLS probes are exercised rather than assumed.
          # The runner's own curl and wget are both OpenSSL, which would test the same path three times.
          sudo apt-get install -y -qq gnutls-bin
          # The binary that ships, rather than the one that happens to be easiest to build: if the static
          # daemon cannot load a probe, nobody wants to find that out from a release.
          ./scripts/smoke.sh target/x86_64-unknown-linux-musl/release/flowlightd

  # The claim this job exists to stop anybody making on a hunch: that because the binary has no libc
  # requirement and the library search reads `/proc`, it therefore works on Fedora. A container has no kernel
  # of its own — these run against the runner's — so what is being tested is each distribution's *userland*:
  # whether the binary runs on it, whether its TLS library is found where that distribution keeps it, and
  # whether a request made by its own `curl` is read.
  distributions:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      # Every distribution is reported, rather than the run stopping at the first one that fails: "it works
      # everywhere except Arch" is the useful sentence, and fail-fast turns it into "it failed".
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            install: apt-get update -qq && apt-get install -y -qq curl jq ca-certificates
          - image: fedora:41
            install: dnf install -y -q curl jq
          - image: archlinux:base
            install: pacman -Sy --noconfirm --quiet curl jq
          - image: opensuse/leap:15.6
            install: zypper --non-interactive --quiet install curl jq
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: static-daemon
          path: built

      - name: Run it inside ${{ matrix.image }}
        run: |
          set -euo pipefail
          chmod +x built/flowlightd
          # `--privileged` because loading a BPF program needs it; the tracefs bind mount because a container
          # gets a fresh `/sys` with tracefs not mounted, and the daemon reads one file out of it to learn the
          # tracepoint's layout on this kernel.
          docker run --rm --privileged --ulimit memlock=-1 \
            -v /sys/kernel/tracing:/sys/kernel/tracing:ro \
            -v "$PWD:/work" -w /work \
            "${{ matrix.image }}" \
            bash -c '${{ matrix.install }} >/dev/null && exec ./scripts/inside-a-distribution.sh built/flowlightd'
