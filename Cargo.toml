[workspace]
resolver = "3"
members = [
    "crates/flowlight-agents",
    "crates/flowlight-ask",
    "crates/flowlight-common",
    "crates/flowlight-daemon",
    "crates/flowlight-ebpf",
    "crates/flowlight-proxy",
    "crates/flowlight-gui",
    "crates/flowlight-rules",
    "crates/flowlight-store",
]

# Only the crate that builds anywhere is a default member. `flowlight-ebpf` compiles for
# `bpfel-unknown-none` alone, and `flowlight-daemon` builds it and links aya, so both need a Linux host. A
# bare `cargo test` should therefore run the tests the machine in front of you can actually run; CI names the
# whole workspace explicitly, on Linux, which is the only place any of this runs.
default-members = [
    "crates/flowlight-agents",
    "crates/flowlight-ask",
    "crates/flowlight-common",
    "crates/flowlight-proxy",
    "crates/flowlight-rules",
    "crates/flowlight-store",
]

[workspace.package]
version = "0.2.9"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/xinbetween/flowlight-linux"
# aya-build sets the floor here; nothing in our own code needs anything this recent.
rust-version = "1.87"

[workspace.dependencies]
flowlight-ask = { path = "crates/flowlight-ask" }
flowlight-proxy = { path = "crates/flowlight-proxy" }
flowlight-common = { path = "crates/flowlight-common", default-features = false }
flowlight-agents = { path = "crates/flowlight-agents" }
flowlight-rules = { path = "crates/flowlight-rules" }
flowlight-store = { path = "crates/flowlight-store" }
aya = "0.14"
aya-build = "0.2"
aya-ebpf = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HPACK, which is not worth writing: a static table, a dynamic table with its own eviction rules, and a
# canonical Huffman code. MIT, which composes with GPL-3.0 without friction.
loona-hpack = "0.4"
sha2 = "0.11"
# The certificate authority interception presents, and the TLS on both sides of the proxy. `ring` in both
# places rather than two crypto backends in one binary: ureq's rustls already uses it.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "1"
# A blocking HTTP client with rustls and no async runtime. The daemon is threads, not futures, and pulling
# in tokio to send a batch of JSON every few seconds would be the tail wagging the dog.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# This daemon runs as root and parses data it did not create. A panic is an outage, and on the interception
# path an outage takes the machine's network with it.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# The eBPF programs are built by aya-build as a separate cargo invocation, and they are built in release even
# when the daemon is not: the verifier rejects the debug build's stack usage and unrolled bounds checks long
# before it rejects anything we wrote.
[profile.dev.package.flowlight-ebpf]
opt-level = 3
debug = false
overflow-checks = false
